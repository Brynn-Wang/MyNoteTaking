<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b5bd6">
  <title>NoteTaker</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20213a;
      background: #f4f5fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 9% 5%, rgba(154, 139, 255, .22), transparent 34rem),
        radial-gradient(ellipse at 94% 95%, rgba(112, 179, 255, .18), transparent 32rem),
        #f5f6fc;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid; width: 46px; height: 46px; place-items: center; border-radius: 15px;
      color: white; background: linear-gradient(140deg, #7971ec, #5168d9);
      box-shadow: 0 10px 22px rgba(91, 91, 214, .25);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.7px; }
    .tagline { margin: 4px 0 0; color: #85879c; font-size: 13px; }
    .workspace {
      display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: 690px;
      overflow: hidden; border: 1px solid rgba(223, 225, 239, .85); border-radius: 24px;
      background: rgba(255,255,255,.88); box-shadow: 0 24px 70px rgba(47, 51, 104, .10);
      backdrop-filter: blur(16px);
    }
    .sidebar { display: flex; flex-direction: column; min-width: 0; padding: 24px 18px; border-right: 1px solid #ececf4; }
    .sidebar-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 3px 17px; }
    .sidebar-heading h2 { margin: 0; color: #666981; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; }
    .note-count { color: #999bb0; font-size: 12px; }
    .new-button, .primary-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 0;
      color: #fff; background: linear-gradient(115deg, #7168e8, #5269d8);
      box-shadow: 0 8px 16px rgba(94, 94, 216, .20); transition: transform .16s, box-shadow .16s;
    }
    .new-button { width: 100%; min-height: 43px; margin-bottom: 16px; border-radius: 12px; font-weight: 650; }
    .new-button:hover, .primary-button:hover { transform: translateY(-1px); box-shadow: 0 11px 20px rgba(94, 94, 216, .27); }
    .search-wrap { position: relative; margin-bottom: 17px; }
    .search-wrap svg { position: absolute; top: 12px; left: 12px; width: 17px; height: 17px; color: #9698ac; }
    .search { width: 100%; height: 41px; padding: 0 12px 0 38px; border: 1px solid #e9eaf2; border-radius: 11px; outline: none; background: #fafaff; color: #282a43; }
    .search:focus, .field:focus, .editor:focus, .language:focus { border-color: #8f8aed; box-shadow: 0 0 0 3px rgba(113, 104, 232, .11); }
    .note-list { flex: 1; overflow: auto; }
    .note-item { width: 100%; padding: 14px 13px; border: 1px solid transparent; border-radius: 13px; background: transparent; color: inherit; text-align: left; }
    .note-item + .note-item { margin-top: 4px; }
    .note-item:hover { background: #f8f8ff; }
    .note-item.active { border-color: #e5e3ff; background: linear-gradient(110deg, #f5f3ff, #f8faff); }
    .note-item-title { overflow: hidden; color: #32334d; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .note-item-preview { overflow: hidden; margin-top: 6px; color: #898ba0; font-size: 12px; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
    .note-item-date { margin-top: 10px; color: #a1a2b2; font-size: 11px; }
    .empty-list { padding: 28px 12px; color: #9698aa; font-size: 13px; text-align: center; line-height: 1.6; }
    .editor-panel { display: flex; min-width: 0; flex-direction: column; padding: 30px 36px 26px; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .editor-label { color: #85879a; font-size: 12px; font-weight: 650; letter-spacing: 1.1px; text-transform: uppercase; }
    .saved-indicator { display: flex; align-items: center; gap: 7px; color: #9294a8; font-size: 12px; }
    .saved-dot { width: 7px; height: 7px; border-radius: 50%; background: #48be91; }
    .field { width: 100%; border: 1px solid transparent; border-radius: 10px; outline: none; color: #252640; transition: border .15s, box-shadow .15s; }
    .title-input { margin-bottom: 12px; padding: 10px 12px; font-size: clamp(22px, 3vw, 30px); font-weight: 720; letter-spacing: -.8px; }
    .title-input::placeholder { color: #c3c4d0; }
    .editor { flex: 1; width: 100%; min-height: 330px; resize: vertical; padding: 14px 13px; border: 1px solid transparent; border-radius: 10px; outline: none; color: #55576d; font-size: 15px; line-height: 1.8; transition: border .15s, box-shadow .15s; }
    .editor::placeholder { color: #b4b5c4; }
    .translate-panel { margin-top: 23px; padding: 17px; border: 1px solid #edecf7; border-radius: 15px; background: #fafaff; }
    .translate-heading { margin: 0 0 12px; color: #65677e; font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    .translate-controls { display: flex; gap: 10px; }
    .language { min-width: 0; flex: 1; padding: 0 12px; border: 1px solid #e7e8f0; border-radius: 10px; outline: none; background: #fff; color: #44465d; }
    .secondary-button, .danger-button, .primary-button { min-height: 42px; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 650; }
    .secondary-button { border: 1px solid #e1e0f5; background: #fff; color: #6460c9; }
    .secondary-button:hover { background: #f4f3ff; }
    .translate-status { min-height: 0; margin-top: 0; color: #35946e; font-size: 12px; }
    .translate-status:not(:empty) { margin-top: 10px; padding: 9px 11px; border-radius: 8px; background: #eaf8f1; }
    .translate-status.error { color: #b34d61; background: #fff0f2; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; }
    .hint { color: #a0a1b0; font-size: 11px; }
    .actions { display: flex; gap: 9px; }
    .danger-button { border: 1px solid #f1dfe3; background: #fff; color: #c05d70; }
    .danger-button:hover { background: #fff5f6; }
    .primary-button:disabled, .secondary-button:disabled, .danger-button:disabled { cursor: not-allowed; opacity: .5; transform: none; box-shadow: none; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 2; padding: 12px 16px; border: 1px solid #d8efdf; border-radius: 12px; background: #f0fbf3; color: #328253; box-shadow: 0 12px 30px rgba(39, 72, 50, .12); font-size: 13px; }
    .toast.error { border-color: #f3dce0; background: #fff3f4; color: #ae4e5e; }
    @media (max-width: 760px) {
      .app-shell { width: min(100% - 24px, 620px); padding-top: 24px; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: 310px; border-right: 0; border-bottom: 1px solid #ececf4; }
      .editor-panel { min-height: 600px; padding: 24px 18px; }
    }
    @media (max-width: 460px) {
      .app-shell { width: calc(100% - 16px); padding-top: 15px; }
      .workspace { border-radius: 18px; }
      .translate-controls { flex-direction: column; }
      .language { min-height: 42px; }
      .editor-footer { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10z"/><path d="M13 3v7h7M8 14h8M8 17h6"/></svg>
        </div>
        <div>
          <h1>NoteTaker</h1>
          <p class="tagline">A little space for all your thoughts</p>
        </div>
      </div>
    </header>

    <section class="workspace" aria-label="Notes workspace">
      <aside class="sidebar">
        <div class="sidebar-heading"><h2>Your notes</h2><span class="note-count" id="note-count">0 notes</span></div>
        <button class="new-button" id="new-note" type="button"><span aria-hidden="true">＋</span> New Note</button>
        <label class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input class="search" id="search" type="search" placeholder="Search notes..." aria-label="Search notes">
        </label>
        <div class="note-list" id="note-list"></div>
      </aside>

      <section class="editor-panel" aria-label="Note editor">
        <div class="editor-top">
          <span class="editor-label">Editor</span>
          <span class="saved-indicator"><span class="saved-dot"></span><span id="save-state">Ready to write</span></span>
        </div>
        <input class="field title-input" id="title" type="text" maxlength="300" placeholder="Untitled note" aria-label="Note title">
        <textarea class="editor" id="content" placeholder="Start writing your thoughts here...&#10;&#10;Your ideas, plans, and inspiration — all in one place." aria-label="Note content"></textarea>

        <div class="translate-panel">
          <h2 class="translate-heading">Translate your note</h2>
          <div class="translate-controls">
            <select class="language" id="target-lang" aria-label="Target language">
              <option value="Chinese">Chinese</option>
              <option value="English">English</option>
              <option value="Spanish">Spanish</option>
              <option value="French">French</option>
              <option value="German">German</option>
              <option value="Japanese">Japanese</option>
              <option value="Korean">Korean</option>
              <option value="Portuguese">Portuguese</option>
              <option value="Italian">Italian</option>
              <option value="Arabic">Arabic</option>
            </select>
            <button class="secondary-button" id="translate" type="button">Translate</button>
          </div>
          <div class="translate-status" id="translate-status" role="status" aria-live="polite"></div>
        </div>

        <footer class="editor-footer">
          <span class="hint">Your notes are saved to your workspace.</span>
          <div class="actions">
            <button class="danger-button" id="delete" type="button" disabled>Delete</button>
            <button class="primary-button" id="save" type="button">Save</button>
          </div>
        </footer>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const elements = {
      list: document.querySelector("#note-list"),
      count: document.querySelector("#note-count"),
      search: document.querySelector("#search"),
      title: document.querySelector("#title"),
      content: document.querySelector("#content"),
      language: document.querySelector("#target-lang"),
      translateStatus: document.querySelector("#translate-status"),
      saveState: document.querySelector("#save-state"),
      save: document.querySelector("#save"),
      remove: document.querySelector("#delete"),
      translate: document.querySelector("#translate"),
      toast: document.querySelector("#toast")
    };
    let notes = [];
    let selectedId = null;
    let toastTimer;

    function showToast(message, isError = false) {
      window.clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.toggle("error", isError);
      elements.toast.hidden = false;
      toastTimer = window.setTimeout(() => { elements.toast.hidden = true; }, 2600);
    }

    async function api(path, options = {}) {
      const response = await fetch(`/api${path}`, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const data = response.status === 204 ? null : await response.json();
      if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
      return data;
    }

    function formatDate(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(new Date(value));
    }

    function renderList() {
      const search = elements.search.value.trim().toLocaleLowerCase();
      const visible = notes.filter(note => `${note.title} ${note.content}`.toLocaleLowerCase().includes(search));
      elements.count.textContent = `${notes.length} ${notes.length === 1 ? "note" : "notes"}`;
      elements.list.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty-list";
        empty.textContent = search ? "No notes match your search." : "No notes yet. Create one to get started.";
        elements.list.append(empty);
        return;
      }

      for (const note of visible) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `note-item${note.id === selectedId ? " active" : ""}`;
        const title = document.createElement("div");
        title.className = "note-item-title";
        title.textContent = note.title || "Untitled note";
        const preview = document.createElement("div");
        preview.className = "note-item-preview";
        preview.textContent = note.content || "No additional text";
        const date = document.createElement("div");
        date.className = "note-item-date";
        date.textContent = formatDate(note.updated_at);
        button.append(title, preview, date);
        button.addEventListener("click", () => selectNote(note));
        elements.list.append(button);
      }
    }

    function selectNote(note) {
      selectedId = note.id;
      elements.title.value = note.title;
      elements.content.value = note.content;
      elements.remove.disabled = false;
      elements.saveState.textContent = "Saved";
      elements.translateStatus.textContent = "";
      elements.translateStatus.classList.remove("error");
      renderList();
    }

    function newNote() {
      selectedId = null;
      elements.title.value = "";
      elements.content.value = "";
      elements.remove.disabled = true;
      elements.saveState.textContent = "New note";
      elements.translateStatus.textContent = "";
      elements.translateStatus.classList.remove("error");
      renderList();
      elements.title.focus();
    }

    async function loadNotes() {
      try {
        notes = await api("/notes");
        renderList();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function saveNote() {
      const payload = { title: elements.title.value, content: elements.content.value };
      elements.save.disabled = true;
      try {
        const saved = await api(selectedId === null ? "/notes" : `/notes/${selectedId}`, {
          method: selectedId === null ? "POST" : "PUT",
          body: JSON.stringify(payload)
        });
        selectedId = saved.id;
        const existingIndex = notes.findIndex(note => note.id === saved.id);
        if (existingIndex === -1) notes.unshift(saved);
        else notes[existingIndex] = saved;
        elements.remove.disabled = false;
        elements.saveState.textContent = "Saved";
        renderList();
        showToast("Note saved");
      } catch (error) {
        showToast(error.message, true);
      } finally {
        elements.save.disabled = false;
      }
    }

    async function deleteNote() {
      if (selectedId === null || !window.confirm("Delete this note? This cannot be undone.")) return;
      elements.remove.disabled = true;
      try {
        await api(`/notes/${selectedId}`, { method: "DELETE" });
        notes = notes.filter(note => note.id !== selectedId);
        newNote();
        showToast("Note deleted");
      } catch (error) {
        elements.remove.disabled = false;
        showToast(error.message, true);
      }
    }

    async function translateNote() {
      elements.translate.disabled = true;
      elements.translate.textContent = "Translating…";
      elements.translateStatus.classList.remove("error");
      elements.translateStatus.textContent = "Translating your note…";
      try {
        const translated = await api("/notes/translate", {
          method: "POST",
          body: JSON.stringify({
            title: elements.title.value,
            content: elements.content.value,
            target_lang: elements.language.value
          })
        });
        elements.title.value = translated.title;
        elements.content.value = translated.content;
        elements.saveState.textContent = "Unsaved changes";
        elements.translateStatus.textContent = "Translation ready — save when you’re happy with it.";
      } catch (error) {
        elements.translateStatus.textContent = error.message;
        elements.translateStatus.classList.add("error");
      } finally {
        elements.translate.disabled = false;
        elements.translate.textContent = "Translate";
      }
    }

    elements.title.addEventListener("input", () => { elements.saveState.textContent = "Unsaved changes"; });
    elements.content.addEventListener("input", () => { elements.saveState.textContent = "Unsaved changes"; });
    elements.search.addEventListener("input", renderList);
    document.querySelector("#new-note").addEventListener("click", newNote);
    elements.save.addEventListener("click", saveNote);
    elements.remove.addEventListener("click", deleteNote);
    elements.translate.addEventListener("click", translateNote);
    loadNotes();
  </script>
</body>
</html>
